<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#11161e">
<title>Слесарь ЦТП</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<canvas id="cv"></canvas>

<div id="hud">
  <div class="hud-l"><div id="h-date"></div><div id="h-wx"></div></div>
  <div class="hud-bars" id="h-bars"></div>
  <div class="hud-r">
    <div class="hud-money"><div id="h-money"></div><div id="h-trust"></div></div>
    <div class="speed" id="speed"></div>
    <button id="b-phone" class="hbtn" aria-label="Телефон">Тел<span id="ph-badge"></span></button>
    <button id="b-menu" class="hbtn" aria-label="Меню">☰</button>
  </div>
</div>

<div id="loc"></div>
<div id="actbar"></div>
<div id="zonebar" class="hidden"></div>
<div id="tut" class="hidden"><div class="t-text"></div><div class="t-btns"></div></div>
<div id="toasts"></div>

<div id="panel" class="hidden">
  <div class="p-head"><h2 id="p-title"></h2><button id="p-close" aria-label="Закрыть">✕</button></div>
  <div id="p-body"></div>
</div>

<div id="busy" class="hidden">
  <div class="b-label"></div>
  <div class="b-bar"><i></i></div>
  <div class="b-time"></div>
  <button class="btn ghost b-wake hidden">Проснуться</button>
</div>

<div id="mg" class="hidden"></div>
<div id="overlay" class="hidden"></div>
<div id="flash"></div>

<script src="js/util.js"></script>
<script src="js/data.js"></script>
<script src="js/state.js"></script>
<script src="js/sim.js"></script>
<script src="js/events.js"></script>
<script src="js/actions.js"></script>
<script src="js/minigames.js"></script>
<script src="js/sound.js"></script>
<script src="js/render.js"></script>
<script src="js/ui.js"></script>
<script src="js/tutorial.js"></script>
<script src="js/main.js"></script>
</body>
</html>
